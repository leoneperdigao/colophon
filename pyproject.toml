[project]
name = "colophon"
version = "0.1.0"
description = "Event-driven document annotation service"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "python-multipart>=0.0.9",
]

# Infra / parsing / LLM adapters are added in their own phase (kept out of the
# walking skeleton so the domain + application layers stay infra-free and fast).
[project.optional-dependencies]
infra = [
    "pika>=1.3",
    "minio>=7.2",
    "psycopg[binary]>=3.2",
]
parsing = [
    "pypdf>=4.2",
    "openpyxl>=3.1",
]
llm = [
    "litellm>=1.40",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
