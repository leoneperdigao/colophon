[project]
name = "colophon"
version = "0.1.0"
description = "Event-driven document annotation service"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "python-multipart>=0.0.9",
    "pypdf>=4.2",
    "openpyxl>=3.1",
]

# Infra / LLM adapters are added in their own phase (kept out of the walking
# skeleton so the domain + application layers stay infra-free and fast).
[project.optional-dependencies]
infra = [
    "pika>=1.3",
    "minio>=7.2",
    "psycopg[binary]>=3.2",
]
llm = [
    "litellm>=1.40",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
    "fpdf2>=2.7",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=app --cov-report=term-missing"
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:Warning",
]

[tool.coverage.run]
source = ["app"]
branch = true
omit = [
    # Exercised by the opt-in e2e suite against real containers (MinIO / Postgres /
    # RabbitMQ), not the no-infra CI run — measuring them here would understate the
    # infra-free core's coverage. See tests/e2e/.
    "app/adapters/outbound/blob/minio_blob.py",
    "app/adapters/outbound/store/postgres_store.py",
    "app/adapters/outbound/messaging/rabbitmq.py",
    # The real LLM transport boundary (calls the provider) — exercised by `make eval`
    # with a model, not the no-model unit run.
    "app/adapters/llm/litellm_transport.py",
    # Process entrypoints — wiring only, run by uvicorn / `python -m app.worker`.
    "app/asgi.py",
    "app/worker/__main__.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
