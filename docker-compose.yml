# Local stack: api + worker + rabbitmq + minio + postgres.
# Secrets and tenant tokens come from .env (copy .env.example -> .env).
# Each backing service gets its own scoped credentials (least privilege); the
# api and worker share one image and differ only by command.
services:
  rabbitmq:
    image: rabbitmq:3.13-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-colophon}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set in .env}
    ports:
      - "5672:5672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?set in .env}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-colophon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-colophon}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-colophon} -d ${POSTGRES_DB:-colophon}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  api:
    build: .
    command: ["uvicorn", "app.asgi:app", "--host", "0.0.0.0", "--port", "8000"]
    environment: &app-env
      APP_PROFILE: local
      TENANT_TOKENS: ${TENANT_TOKENS:?set in .env}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-colophon}:${RABBITMQ_PASSWORD:?set in .env}@rabbitmq:5672/
      DATABASE_URL: postgresql://${POSTGRES_USER:-colophon}:${POSTGRES_PASSWORD:?set in .env}@postgres:5432/${POSTGRES_DB:-colophon}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?set in .env}
      MINIO_BUCKET: ${MINIO_BUCKET:-colophon-raw}
      MINIO_SECURE: "false"
      LLM_MODEL: ${LLM_MODEL:-stub}
      LLM_API_BASE: ${LLM_API_BASE:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-10485760}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started
    restart: on-failure  # self-heal until MinIO answers / bucket is created

  worker:
    build: .
    command: ["python", "-m", "app.worker"]
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started
    restart: on-failure

volumes:
  minio-data:
  postgres-data:
